
modLoader="javafml"

loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

authors="Nexo, ReverieJam"

description='''
This mod adds movesets for some of left-behind weapons from Weapons of Miracles. Ported by ReveryJam
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="epicfight"
    mandatory=true
    versionRange="[21.14.1,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies."${mod_id}"]]
    modId="wom"
    mandatory=true
    versionRange="[2.0,)"
    ordering="AFTER"
    side="BOTH"
